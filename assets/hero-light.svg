<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Nangel — he construido productos SaaS de extremo a extremo">
  <defs>
    <linearGradient id="velo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f9d6b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f9d6b" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#eaeef2"/>
    </pattern>
    <!-- Sin esta mascara la trama arranca de golpe y deja una costura vertical. -->
    <linearGradient id="desvanecido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="35%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="mascara">
      <rect width="1000" height="240" fill="url(#desvanecido)"/>
    </mask>
  </defs>

  <rect width="1000" height="240" rx="12" fill="#ffffff"/>
  <rect width="1000" height="240" fill="url(#puntos)" mask="url(#mascara)"/>
  <rect width="1000" height="240" fill="url(#velo)"/>
  <rect x="0" y="0" width="5" height="240" rx="2.5" fill="#0f9d6b"/>

  <text x="56" y="98" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#1f2328" letter-spacing="-1.6">Nangel</text>
  <text x="58" y="140" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#59636e">He construido productos SaaS de extremo a extremo</text>
  <rect x="58" y="162" width="34" height="2.5" rx="1.25" fill="#0f9d6b"/>
  <text x="58" y="192" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#0f9d6b" letter-spacing="1">LLM &#183; TypeScript &#183; React &#183; Supabase &#183; Stripe &#183; Unity</text>

  <g transform="translate(748,86)">
    <rect x="0"   y="0" width="52" height="52" rx="8" fill="none" stroke="#0f9d6b" stroke-width="2.4"/>
    <rect x="68"  y="0" width="52" height="52" rx="8" fill="#0f9d6b" opacity="0.20"/>
    <rect x="136" y="0" width="52" height="52" rx="8" fill="none" stroke="#0f9d6b" stroke-width="2.4" opacity="0.45"/>
    <path d="M52 26 h16 M120 26 h16" stroke="#0f9d6b" stroke-width="2.4" opacity="0.6"/>
  </g>
</svg>