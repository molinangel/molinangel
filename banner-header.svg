<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nangel — producto de punta a punta">
  <defs>
    <!-- Desenfoque fuerte: convierte las elipses en manchas de color difusas,
         que es lo que da el efecto aurora en lugar de formas reconocibles -->
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>

    <!-- Grano sutil encima de todo: evita el banding del degradado y da
         textura de superficie en vez de plano digital -->
    <filter id="grano">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="ruido"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <linearGradient id="filete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0f9d6b"/>
      <stop offset="38%"  stop-color="#1f6feb"/>
      <stop offset="72%"  stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#0f9d6b"/>
      <animate attributeName="x1" values="0;-1;0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1"  dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="subrayado" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0f9d6b"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>

    <clipPath id="marco"><rect width="1200" height="300"/></clipPath>
  </defs>

  <rect width="1200" height="300" fill="#08090d"/>

  <!-- Las tres manchas de color. Cada una deriva en su propio ciclo y con
       duraciones primas entre si, para que la composicion nunca se repita
       exactamente y no se perciba el bucle -->
  <g clip-path="url(#marco)" filter="url(#suave)" opacity="0.92">
    <ellipse cx="230" cy="120" rx="260" ry="150" fill="#0f9d6b" opacity="0.55">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 90,40; -40,25; 0,0" dur="19s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="620" cy="200" rx="300" ry="160" fill="#1f6feb" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -80,-45; 60,30; 0,0" dur="23s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1010" cy="110" rx="270" ry="150" fill="#8957e5" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 55,50; -70,-20; 0,0" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="820" cy="260" rx="220" ry="120" fill="#0f9d6b" opacity="0.3">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -60,-35; 40,15; 0,0" dur="29s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Velo oscuro: baja el brillo del aurora para que el texto tenga
       contraste suficiente sin apagar el color -->
  <rect width="1200" height="300" fill="#08090d" opacity="0.42"/>
  <rect width="1200" height="300" filter="url(#grano)" fill="#ffffff"/>

  <rect x="0" y="0" width="1200" height="3.5" fill="url(#filete)"/>

  <!-- Prompt de terminal como marca, con cursor latente -->
  <text x="78" y="152" font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="42" font-weight="600" fill="#0f9d6b">&#8250;
    <animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/>
  </text>

  <text x="122" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="82" font-weight="700" fill="#ffffff" letter-spacing="-2.5">Nangel</text>

  <rect x="124" y="176" width="0" height="4" rx="2" fill="url(#subrayado)">
    <animate attributeName="width" from="0" to="168" dur="1s" begin="0.35s" fill="freeze"/>
  </rect>

  <text x="124" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="22" fill="#c9d1d9" letter-spacing="0.1" opacity="0">Producto de punta a punta, no solo la pantalla
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.8s" fill="freeze"/>
  </text>

  <text x="124" y="253" font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="15" fill="#8b949e" letter-spacing="0.7" opacity="0">TypeScript · PostgreSQL · Supabase · Modelos de lenguaje en producto
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- Zona horaria con punto de estado, anclado a la derecha -->
  <circle cx="1064" cy="247" r="4" fill="#0f9d6b">
    <animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="1122" y="252" text-anchor="end"
        font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="14" fill="#8b949e" letter-spacing="0.8">UTC−4</text>
</svg>
