<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Nangel — TypeScript, PostgreSQL, modelos de lenguaje en producto">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0f9d6b"/>
      <stop offset="50%"  stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>

    <!-- Halo verde: respira lentamente para dar vida sin distraer -->
    <radialGradient id="halo1" cx="26%" cy="42%" r="52%">
      <stop offset="0%"   stop-color="#0f9d6b" stop-opacity="0.20">
        <animate attributeName="stop-opacity" values="0.20;0.32;0.20" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f9d6b" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo violeta, desfasado del anterior para que nunca latan a la vez -->
    <radialGradient id="halo2" cx="80%" cy="62%" r="48%">
      <stop offset="0%"   stop-color="#8957e5" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.30;0.18" dur="7s" begin="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#fondo)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#halo1)"/>
  <rect width="1200" height="260" fill="url(#halo2)"/>

  <!-- Filete superior: se dibuja de izquierda a derecha al cargar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#acento)">
    <animate attributeName="width" from="0" to="1200" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- Prompt de terminal, con cursor que parpadea -->
  <text x="72" y="118" font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="30" fill="#0f9d6b">&#8250;
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <text x="106" y="120" font-family="'Segoe UI','Helvetica Neue',sans-serif"
        font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1.5" opacity="0">Nangel
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Subrayado de acento: crece bajo el nombre -->
  <rect x="108" y="140" width="0" height="3" rx="1.5" fill="url(#acento)">
    <animate attributeName="width" from="0" to="112" dur="0.7s" begin="1.0s" fill="freeze"/>
  </rect>

  <text x="108" y="176" font-family="'Segoe UI','Helvetica Neue',sans-serif"
        font-size="19" fill="#8b949e" letter-spacing="0.2" opacity="0">Producto de punta a punta, no solo la pantalla
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.2s" fill="freeze"/>
  </text>

  <text x="108" y="207" font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="14.5" fill="#6e7681" letter-spacing="0.6" opacity="0">TypeScript · PostgreSQL · Supabase · Modelos de lenguaje en producto
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.5s" fill="freeze"/>
  </text>

  <text x="1128" y="207" text-anchor="end"
        font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="13" fill="#484f58" letter-spacing="0.8" opacity="0">UTC−4
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.8s" fill="freeze"/>
  </text>

  <rect x="0" y="257" width="1200" height="3" fill="url(#acento)" opacity="0.45"/>
</svg>
