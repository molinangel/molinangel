<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Contacto — nangelm.dev@gmail.com, remoto UTC−4">
  <defs>
    <linearGradient id="fFondo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#161b22"/>
      <stop offset="55%"  stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Degradado invertido respecto al header, para cerrar en espejo -->
    <linearGradient id="fAcento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8957e5"/>
      <stop offset="50%"  stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0f9d6b"/>
    </linearGradient>

    <radialGradient id="fHalo" cx="72%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#1f6feb" stop-opacity="0.16">
        <animate attributeName="stop-opacity" values="0.16;0.26;0.16" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <pattern id="fGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="150" fill="url(#fFondo)"/>
  <rect width="1200" height="150" fill="url(#fGrid)"/>
  <rect width="1200" height="150" fill="url(#fHalo)"/>

  <rect x="0" y="0" width="1200" height="3" fill="url(#fAcento)"/>

  <text x="72" y="66" font-family="'Segoe UI','Helvetica Neue',sans-serif"
        font-size="27" font-weight="650" fill="#e6edf3" letter-spacing="-0.3">Hablemos</text>

  <rect x="74" y="80" width="0" height="2.5" rx="1.25" fill="url(#fAcento)">
    <animate attributeName="width" from="0" to="72" dur="0.8s" begin="0.4s" fill="freeze"/>
  </rect>

  <text x="72" y="110" font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="15" fill="#8b949e" letter-spacing="0.4">nangelm.dev@gmail.com</text>

  <!-- Punto de estado: latido lento, señal de "disponible" sin decirlo -->
  <circle cx="1082" cy="66" r="4.5" fill="#0f9d6b">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1128" y="71" text-anchor="end"
        font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="14" fill="#8b949e" letter-spacing="0.6">Remoto · UTC−4</text>
  <text x="1128" y="110" text-anchor="end"
        font-family="'Cascadia Mono','JetBrains Mono','Consolas',monospace"
        font-size="12.5" fill="#484f58" letter-spacing="0.6">github.com/molinangel</text>
</svg>
